# =============================================================================
# PostgreSQL Configuration for RutIA
# Optimizado para análisis espacial con PostGIS + H3
# =============================================================================

# CONEXIONES Y AUTENTICACIÓN
# -----------------------------------------------------------------------------
max_connections = 200
shared_preload_libraries = 'postgis'

# MEMORIA Y BUFFERS (optimizado para spatial queries)
# -----------------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Para operaciones espaciales intensivas
temp_buffers = 32MB
max_stack_depth = 8MB

# CHECKPOINT Y WAL (Write-Ahead Log)
# -----------------------------------------------------------------------------
checkpoint_completion_target = 0.9
wal_buffers = 16MB
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 1GB

# PLANNER SETTINGS (optimizado para spatial queries)
# -----------------------------------------------------------------------------
random_page_cost = 1.1  # Para SSD
effective_io_concurrency = 200
seq_page_cost = 1.0

# Costos específicos para índices espaciales
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# CONFIGURACIÓN ESPACIAL ESPECÍFICA
# -----------------------------------------------------------------------------

# PostGIS optimizations
postgis.enable_outdb_rasters = false
postgis.gdal_enabled_drivers = 'ENABLE_ALL'

# H3 y análisis hexagonal
shared_preload_libraries = 'postgis, h3'  # Si tienes extensión H3

# LOGGING (para debugging espacial)
# -----------------------------------------------------------------------------
log_statement = 'mod'  # Log modificaciones
log_min_duration_statement = 1000  # Log queries > 1 segundo
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on

# Logging específico para queries espaciales
log_lock_waits = on
log_temp_files = 0

# ESTADÍSTICAS (para optimizar spatial queries)
# -----------------------------------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl  # Para funciones PostGIS

# Estadísticas extendidas para análisis espacial
default_statistics_target = 1000  # Más estadísticas para spatial columns

# CONFIGURACIÓN DE LOCALE
# -----------------------------------------------------------------------------
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# TIMEZONE
# -----------------------------------------------------------------------------
timezone = 'America/Argentina/Buenos_Aires'
log_timezone = 'America/Argentina/Buenos_Aires'

# CONFIGURACIÓN AVANZADA PARA RUTIA
# -----------------------------------------------------------------------------

# Para grandes datasets espaciales
enable_partitionwise_join = on
enable_partitionwise_aggregate = on

# Parallel queries para análisis espacial
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_worker_processes = 8
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0

# JIT compilation para funciones PostGIS complejas
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# CONFIGURACIÓN DE SEGURIDAD
# -----------------------------------------------------------------------------
ssl = off  # Para desarrollo local
password_encryption = md5

# CONFIGURACIÓN DE REPLICACIÓN (disabled para demo)
# -----------------------------------------------------------------------------
wal_level = replica
max_wal_senders = 0
max_replication_slots = 0

# CONFIGURACIÓN ESPECÍFICA PARA DOCKER
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432

# Configuración para volúmenes Docker
fsync = off  # Solo para desarrollo/demo
synchronous_commit = off  # Solo para desarrollo/demo
full_page_writes = off  # Solo para desarrollo/demo

# EXTENSIONES AUTOMÁTICAS
# -----------------------------------------------------------------------------
# Se cargan automáticamente al iniciar
shared_preload_libraries = 'postgis'

# Para habilitar automáticamente en rutia_db:
# CREATE EXTENSION IF NOT EXISTS postgis;
# CREATE EXTENSION IF NOT EXISTS postgis_topology;
# CREATE EXTENSION IF NOT EXISTS h3;  -- Si está disponible